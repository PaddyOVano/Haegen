<section class="contact">
    <h2>Contattaci</h2>

    <form action="https://formsubmit.co/haegenofficial@gmail.com" method="POST">
        <input
            type="hidden"
            name="_subject"
            value="Nuovo messaggio dal sito Haegen"
        >

        <label for="contact-name">Name</label>
        <input
            id="contact-name"
            type="text"
            name="name"
            required
        >

        <label for="contact-email">Email</label>
        <input
            id="contact-email"
            type="email"
            name="email"
            required
        >

        <label for="contact-message">Message</label>
        <textarea
            id="contact-message"
            name="message"
            rows="6"
            required
        ></textarea>

        <button type="submit">Send Message</button>
    </form>
</section>
